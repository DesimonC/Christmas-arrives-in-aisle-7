<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b24">
  <title>Christmas Comes to Aisle 7</title>
  <link rel="stylesheet" href="reader.css">
  <script src="reader.js" defer></script>
</head>
<body>
  <header>
    <h1>Christmas Comes to Aisle 7</h1>
  </header>
  <main>
    <figure>
      <img id="slide" src="slides/01.webp" alt="Storybook page 1" fetchpriority="high">
      <div id="website-page" hidden>
        <div class="closing-note">
          <p>I made this storybook and realised I was a bit late to the party to get it published before Christmas. I hope to have it completely finished and ready to go next year.</p>
          <p>Visit my DesK Apps website to see what else I’ve been up to. I’m looking for people to try my apps on their own devices. If you’d like to help, please register as a tester.</p>
        </div>
        <div class="closing-links">
          <a href="https://deskappswebsite.netlify.app/">
            <img src="desk-apps-logo.webp" alt="" loading="lazy">
            <span>Visit DesK Apps</span>
          </a>
          <a class="tester-link" href="https://deskappswebsite.netlify.app/#testers">Become a tester</a>
        </div>
      </div>
    </figure>
    <nav aria-label="Storybook pages">
      <button id="back" type="button" disabled><span aria-hidden="true">←</span> Back</button>
      <p id="progress" role="status">Page 1 of 27</p>
      <button id="next" type="button">Next <span aria-hidden="true">→</span></button>
      <button id="playback" type="button">Play slideshow</button>
    </nav>
    <noscript><p>Enable JavaScript to use the page buttons.</p></noscript>
  </main>
</body>
</html>
